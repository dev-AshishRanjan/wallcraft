name: Manual Database Seed

on:
  workflow_dispatch:
    inputs:
      category_count:
        description: 'Number of Categories to Target'
        required: true
        default: '5'
        type: choice
        options: 
          - '1'
          - '3'
          - '5'
          - '10'
          - '20'
      images_per_category:
        description: 'Images per Category [Max Total 30]'
        required: true
        default: '5'
        type: string

permissions:
  contents: write

jobs:
  seed-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Bulk Generator
        id: generator
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }} 
        run: |
          npx tsx scripts/generate-bulk-wallpapers.ts \
            --cats=${{ inputs.category_count }} \
            --imgs=${{ inputs.images_per_category }}

      - name: Check for Changes
        id: verify_diff
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new wallpapers found. Exiting."
          fi

      - name: Generate Release Metadata
        run: |
          # Create a simple JSON with timestamp. 
          # ideally, your process.ts should write a 'meta.json' with Unsplash credits.
          # If process.ts handles it, you can skip this 'echo'.
          if [ ! -f output/meta.json ]; then
            echo "{\"generated_at\": \"$(date -u)\", \"run_id\": \"${{ github.run_id }}\"}" > output/meta.json
          fi

      - name: Commit DB & History
        run: |
          git config --global user.name 'WallCraft Bulk Bot'
          git config --global user.email 'bot@wallcraft.app'
          git add history.json public/database.json
          git commit -m "chore(db): seeded ${{ inputs.category_count }} cats x ${{ inputs.images_per_category }} imgs [skip ci]"
          git push
      
      - name: Read Tag Name
        id: tag_reader
        run: |
          TAG=$(cat output/tag_name.txt)
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_reader.outputs.TAG_NAME }}
          name: ${{ steps.tag_reader.outputs.TAG_NAME }}
          body_path: output/release_body.md
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}