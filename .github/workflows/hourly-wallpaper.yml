name: Hourly Wallpaper Generator

on:
  schedule:
    # Runs at minute 0 past every hour (Cron format)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to click "Run Now" manually for testing

permissions:
  contents: write # REQUIRED: Allows the action to create Releases

jobs:
  generate-and-release:
    name: Process & Upload
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Create Output Directory (Ensures folder exists before script runs)
      - name: Create Output Directory
        run: mkdir -p output

      # 5. Run the TypeScript Logic
      # We pass the secret here. Make sure UNSPLASH_ACCESS_KEY is in Repo Settings > Secrets
      - name: Generate Wallpapers
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: npx ts-node scripts/process.ts

      # 6. Generate Metadata for Frontend
      # We save a JSON file detailing this run. The frontend will fetch this to show credits.
      - name: Generate Release Metadata
        run: |
          # Create a simple JSON with timestamp. 
          # ideally, your process.ts should write a 'meta.json' with Unsplash credits.
          # If process.ts handles it, you can skip this 'echo'.
          if [ ! -f output/meta.json ]; then
            echo "{\"generated_at\": \"$(date -u)\", \"run_id\": \"${{ github.run_id }}\"}" > output/meta.json
          fi

      # 7. Commit the updated history.json back to repo
      - name: Commit DB & History
        run: |
          git config --global user.name 'HueForge Bot'
          git config --global user.email 'bot@hueforge.local'
          git add history.json public/database.json
          git commit -m "chore: new wallpaper drop [skip ci]" || echo "No changes to commit"
          git push
      
      - name: Read Tag Name
        id: tag_reader
        run: |
          TAG=$(cat output/tag_name.txt)
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      # 9. Upload to GitHub Releases (The Storage Layer)
      # This saves the images as binary assets attached to the release tag.
      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag_reader.outputs.TAG_NAME }}
          name: ${{ steps.tag_reader.outputs.TAG_NAME }}
          body_path: output/release_body.md
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-frontend:
    needs: generate-and-release
    runs-on: ubuntu-latest
    name: Deploy Nextjs App
    permissions:
      contents: write
      pages: write      # Required for GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # 1. Pull the changes made by the previous job (history.json, database.json)
      - name: Pull Latest Changes
        run: git pull origin main
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build # This uses the freshly updated database.json

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: out # Next.js 'export' output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2